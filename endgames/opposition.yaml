# Opposition: king and pawn positions where the kings facing each other decides the result.
# Goal: promote the pawn, or (as the lone king) hold the draw.
# Schema: see "Endgame trainer" in README.md. The player is the side to move.
# Every position was checked with python-chess (legal, not over); in each one only a
# single first move keeps the result, confirmed with Stockfish's king-and-pawn knowledge.
positions:
  - id: opp-take-the-opposition
    title: Take the opposition
    fen: 8/8/4k3/8/8/4PK2/8/8 w - - 0 1
    goal: promote
    hint: >-
      Step up so the kings face each other with one square between them and
      Black to move. Black must then give way and your king gets in front.
  - id: opp-face-to-face
    title: Face to face
    fen: 8/4k3/8/8/3KP3/8/8/8 w - - 0 1
    goal: promote
    hint: >-
      Put your king in front of the pawn, facing the black king with one square
      between them. Pushing the pawn too early throws the win away.
  - id: opp-hold-the-opposition
    title: Hold the opposition
    fen: 8/8/3k4/8/4K3/4P3/8/8 b - - 0 1
    goal: draw
    hint: >-
      Defend by facing the white king directly: go to e6. Whenever it steps
      aside, step across with it and keep the kings face to face.
